<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Lesson - 51Talk Lesson Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563EB', 'primary-light': '#EFF6FF', 'primary-dark': '#1E3A8A', success: '#10B981', card: '#FFFFFF', surface: '#F8FAFC', border: '#E2E8F0', 'dark-surface': '#0F172A', 'text-primary': '#0F172A', 'text-secondary': '#64748B' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-surface text-text-primary font-sans pb-20">

    <nav class="sticky top-0 z-50 h-[56px] bg-primary-dark flex items-center justify-between px-6 shadow-md">
        <a href="/" class="flex items-center gap-3">
            <img src="/51talklogo.png" alt="Logo" class="h-[24px]">
            <span data-i18n="brand" class="text-white font-semibold border-l border-white/20 pl-3">Lesson Studio</span>
        </a>
        <div class="flex items-center gap-4 text-white">
            <button id="lang-switch" onclick="toggleLang()" class="text-sm hover:text-primary-light min-w-[2rem]">AR</button>
            <a href="/" class="p-1 hover:bg-white/10 rounded-full"><i class="ph ph-house text-xl"></i></a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-8">
        
        <div class="bg-card rounded-2xl border border-border shadow-card p-8 mb-6" id="form-card">
            <h2 class="text-2xl font-bold mb-6" data-i18n="quick_title">Quick Single Lesson</h2>
            
            <label class="block text-sm font-semibold mb-2" data-i18n="quick_level_label">Target CEFR Level</label>
            <div class="grid grid-cols-5 gap-3 mb-6" id="level-selector-grid"></div>

            <label class="block text-sm font-semibold mb-2" data-i18n="quick_blueprint_label">Lesson Blueprint</label>
            <textarea id="blueprint-input" class="w-full border border-border rounded-lg p-4 font-mono text-sm focus:ring-2 focus:ring-primary focus:outline-none mb-6" rows="6" placeholder="Lesson: Airport Directions&#10;Vocabulary: gate, terminal, customs&#10;Functional Language: Where is... / How do I get to...&#10;Topic: Airport"></textarea>

            <button onclick="generateLesson()" id="btn-submit" class="w-full py-3 bg-primary text-white rounded-xl font-bold shadow-md hover:bg-blue-700 transition-colors">
                <i class="ph ph-magic-wand mr-2 align-middle"></i><span data-i18n="generate_material">Generate Material</span>
            </button>
        </div>

        <div class="bg-card rounded-2xl border border-border shadow-card p-8 mb-6 hidden" id="progress-card">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg" id="status-title" data-i18n="generating">Generating...</h3>
                <div class="w-6 h-6 border-2 border-primary border-t-transparent rounded-full animate-spin" id="progress-spinner"></div>
            </div>
            
            <div class="bg-dark-surface rounded-xl p-4 h-[200px] overflow-y-auto font-mono text-xs text-slate-300 flex flex-col gap-1" id="log-panel"></div>
        </div>

        <div class="bg-card rounded-2xl border border-border shadow-card p-8 hidden" id="result-card">
            <h3 class="font-bold text-lg text-success mb-4 flex items-center gap-2">
                <i class="ph ph-check-circle text-2xl"></i>
                <span data-i18n="ready">Ready</span>
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="result-files"></div>
        </div>

    </main>

    <script src="/i18n.js"></script>
    <script src="/components.js"></script>
    <script>
        const API_BASE = window.location.origin;
        let currentLevel = 'A1';

        Components.renderLevelSelector('level-selector-grid', currentLevel, (lvl) => { currentLevel = lvl; });

        function generateLesson() {
            const blueprint = document.getElementById('blueprint-input').value.trim();
            if (!blueprint) return alert(t('please_enter_blueprint'));

            document.getElementById('form-card').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('btn-submit').innerHTML = '<i class="ph ph-spinner animate-spin mr-2 align-middle"></i>' + t('generating');
            document.getElementById('progress-card').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
            
            const logPanel = document.getElementById('log-panel');
            logPanel.innerHTML = '';
            document.getElementById('progress-spinner').classList.remove('hidden');
            document.getElementById('status-title').classList.remove('text-success');
            document.getElementById('status-title').textContent = t('generating');

            Components.fetchSSE(`${API_BASE}/api/lesson/generate`, { level: currentLevel, blueprint: blueprint }, {
                start: (data) => {
                    document.getElementById('status-title').innerText = `Starting: ${data.name || ''}`;
                },
                progress: (data) => {
                    document.getElementById('status-title').innerText = `Stage: ${data.status}`;
                },
                log: (data) => {
                    logPanel.innerHTML += `<div>> ${data.line}</div>`;
                    logPanel.scrollTop = logPanel.scrollHeight;
                },
                complete: (data) => {
                    document.getElementById('progress-spinner').classList.add('hidden');
                    document.getElementById('status-title').innerText = t('ready');
                    document.getElementById('status-title').classList.add('text-success');
                    
                    document.getElementById('result-card').classList.remove('hidden');
                    Components.renderFileGrid('result-files', data.files);
                    
                    document.getElementById('form-card').classList.remove('opacity-50', 'pointer-events-none');
                    document.getElementById('btn-submit').innerHTML = '<i class="ph ph-magic-wand mr-2 align-middle"></i>' + t('generate_material');
                },
                error: (err) => {
                    logPanel.innerHTML += `<div class="text-error">> Request Failed: ${err.message || err}</div>`;
                    document.getElementById('form-card').classList.remove('opacity-50', 'pointer-events-none');
                    document.getElementById('btn-submit').innerHTML = '<i class="ph ph-magic-wand mr-2 align-middle"></i>' + t('generate_material');
                }
            });
        }
    </script>
</body>
</html>
